# NeuroLens — Volt-style Flask UI + API (no Streamlit)
#
#   docker compose up --build
#   open http://localhost:5000
#
# Services:
#   web     — Flask (Jinja Volt UI + /api/* + PyTorch)
#   mongo   — patient / prediction storage
#   mailpit — local SMTP + inbox for report emails

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: neurolens-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: neurolens-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: neurolens-web:latest
    container_name: neurolens-web
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"
      FLASK_USE_RELOADER: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-neurolens-docker-change-me}
      MODEL_PATH: /app/models/model.pth
      CT_MODEL_PATH: /app/models/ct_stacking_ensemble.pth
      CLINICAL_MODEL_PATH: /app/models/randomforest_clinical.joblib
      CLINICAL_XGB_PATH: /app/models/xgboost_clinical.json
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-alzheimers}
      CORS_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
      # Mailpit by default (override in .env for Gmail etc.)
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-neurolens@localhost}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-0}
      EMAIL_SMTP_SSL: ${EMAIL_SMTP_SSL:-0}
    ports:
      - "5000:5000"
    volumes:
      # Live model weights (read-only)
      - ./models:/app/models:ro
      # UI cache + local data
      - neurolens_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:5000/health",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s

volumes:
  mongo_data:
  neurolens_data:
