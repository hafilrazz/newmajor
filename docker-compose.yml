# NeuroLens — Flask UI + API (no Streamlit)
# Usage: docker compose up --build
# App:  http://localhost:5000
# Mail: http://localhost:8025

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: neurolens-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  mongo:
    image: mongo:7
    container_name: neurolens-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Unified Flask application: premium HTML UI + REST API + ML
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neurolens-web
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"
      FLASK_USE_RELOADER: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-neurolens-docker-change-me}
      MODEL_PATH: /app/models/model.pth
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: alzheimers
      CORS_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
      # Optional email via Mailpit (override in .env for real SMTP)
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-neurolens@localhost}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-0}
      EMAIL_SMTP_SSL: ${EMAIL_SMTP_SSL:-0}
    ports:
      - "5000:5000"
    volumes:
      # Mount trained weights (read-only)
      - ./models:/app/models:ro
      # Persist UI session cache + local data
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mongo_data:
